global:
  resolve_timeout: 5m

route:
  receiver: default-receiver
  group_by: ["alertname", "service"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 2h
  routes:
    - matchers:
        - severity="critical"
      receiver: critical-receiver

receivers:
  - name: default-receiver
    webhook_configs:
      - url: "http://example-webhook.local/default"
        send_resolved: true

  - name: critical-receiver
    webhook_configs:
      - url: "http://example-webhook.local/critical"
        send_resolved: true

templates: []

services:
  app:
    image: flask-gym:local
    restart: unless-stopped
    env_file:
      - .env
    environment:
      USE_PROXY_FIX: "true"
      PROXY_FIX_X_FOR: "1"
      PROXY_FIX_X_PROTO: "1"
      PROXY_FIX_X_HOST: "1"
      PROXY_FIX_X_PORT: "1"
      ENABLE_HSTS: "true"
      HSTS_PRELOAD: "true"
      SESSION_COOKIE_SECURE: "true"
      METRICS_ENABLED: "true"
    expose:
      - "8000"
    volumes:
      - app_instance:/app/instance
      - app_logs:/app/Loggings
    healthcheck:
      test: ["CMD", "python", "-c", "import sys, urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3); sys.exit(0)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/flask-gym.tls.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/nginx/certs:/etc/nginx/certs:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1/healthz >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  app_instance:
  app_logs:

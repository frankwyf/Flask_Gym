name: CI CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install ruff bandit pip-audit cyclonedx-bom

      - name: Lint critical Python issues
        run: |
          ruff check app tests --select=E9,F63,F7,F82

      - name: Security scan (Bandit)
        run: |
          bandit -q -r app -x app/static -f txt -o bandit-report.txt

      - name: Dependency vulnerability scan (pip-audit)
        run: |
          pip-audit -r requirements.txt -f json -o pip-audit-report.json

      - name: Generate SBOM (CycloneDX)
        run: |
          cyclonedx-py requirements requirements.txt --output-file sbom.cdx.json --output-format JSON

      - name: Upload security report
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: security-reports
          path: bandit-report.txt
          if-no-files-found: warn

      - name: Upload dependency audit report
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: pip-audit-report
          path: pip-audit-report.json
          if-no-files-found: warn

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json
          if-no-files-found: warn

  test:
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run tests
        run: |
          python -m pytest -q --junitxml=reports/junit-${{ matrix.python-version }}.xml --cov=app --cov-config=configs/.coveragerc --cov-report=xml

      - name: Upload test artifacts
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: test-artifacts-${{ matrix.python-version }}
          path: |
            reports/junit-${{ matrix.python-version }}.xml
            coverage.xml
          if-no-files-found: warn

  build-package:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build application container
        run: |
          docker build --pull -t flask-gym:${{ github.sha }} .

      - name: Save container image
        run: |
          docker save flask-gym:${{ github.sha }} -o flask-gym-image.tar

      - name: Upload deployment bundle
        uses: actions/upload-artifact@v5
        with:
          name: flask-gym-deployment-bundle
          path: |
            flask-gym-image.tar
            Dockerfile
            requirements.txt
            docker-compose.prod.yml
            docker-compose.prod.tls.yml
            deploy/nginx/flask-gym.conf
            deploy/nginx/flask-gym.tls.conf

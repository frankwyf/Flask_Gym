name: Release Pipeline

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag (SemVer, e.g. v1.2.3)"
        required: true
        type: string

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref_name || inputs.release_tag }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve release tag
        id: resolve_tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "release_tag=${{ inputs.release_tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "release_tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate release tag format
        shell: bash
        run: |
          RELEASE_TAG="${{ steps.resolve_tag.outputs.release_tag }}"
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: $RELEASE_TAG"
            echo "Expected format: vMAJOR.MINOR.PATCH"
            exit 1
          fi

      - name: Create tag on manual release
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          RELEASE_TAG="${{ steps.resolve_tag.outputs.release_tag }}"
          if git rev-parse "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Tag $RELEASE_TAG already exists; reusing existing tag."
          else
            git tag "$RELEASE_TAG"
            git push origin "$RELEASE_TAG"
          fi

      - name: Build release bundle
        shell: bash
        run: |
          RELEASE_TAG="${{ steps.resolve_tag.outputs.release_tag }}"
          mkdir -p dist
          git archive --format=zip --output "dist/flask-gym-${RELEASE_TAG}.zip" HEAD
          tar -czf "dist/flask-gym-${RELEASE_TAG}.tar.gz" . \
            --exclude=.git \
            --exclude=.venv \
            --exclude=instance \
            --exclude=Loggings \
            --exclude=tests/.pytest_flask_gym.db

      - name: Generate checksum manifest
        shell: bash
        run: |
          RELEASE_TAG="${{ steps.resolve_tag.outputs.release_tag }}"
          cd dist
          sha256sum "flask-gym-${RELEASE_TAG}.zip" "flask-gym-${RELEASE_TAG}.tar.gz" > "flask-gym-${RELEASE_TAG}.sha256"

      - name: Upload release bundle artifact
        uses: actions/upload-artifact@v5
        with:
          name: release-bundle-${{ steps.resolve_tag.outputs.release_tag }}
          path: dist/
          if-no-files-found: error

      - name: Install cosign
        uses: sigstore/cosign-installer@v3.7.0

      - name: Sign release assets with cosign (keyless)
        shell: bash
        run: |
          RELEASE_TAG="${{ steps.resolve_tag.outputs.release_tag }}"
          cosign sign-blob --yes \
            --output-certificate "dist/flask-gym-${RELEASE_TAG}.zip.pem" \
            --output-signature "dist/flask-gym-${RELEASE_TAG}.zip.sig" \
            "dist/flask-gym-${RELEASE_TAG}.zip"
          cosign sign-blob --yes \
            --output-certificate "dist/flask-gym-${RELEASE_TAG}.tar.gz.pem" \
            --output-signature "dist/flask-gym-${RELEASE_TAG}.tar.gz.sig" \
            "dist/flask-gym-${RELEASE_TAG}.tar.gz"

      - name: Upload signature artifacts
        uses: actions/upload-artifact@v5
        with:
          name: release-signatures-${{ steps.resolve_tag.outputs.release_tag }}
          path: |
            dist/*.sig
            dist/*.pem
          if-no-files-found: error

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.resolve_tag.outputs.release_tag }}
          generate_release_notes: true
          files: |
            dist/flask-gym-${{ steps.resolve_tag.outputs.release_tag }}.zip
            dist/flask-gym-${{ steps.resolve_tag.outputs.release_tag }}.tar.gz
            dist/flask-gym-${{ steps.resolve_tag.outputs.release_tag }}.sha256
            dist/flask-gym-${{ steps.resolve_tag.outputs.release_tag }}.zip.sig
            dist/flask-gym-${{ steps.resolve_tag.outputs.release_tag }}.zip.pem
            dist/flask-gym-${{ steps.resolve_tag.outputs.release_tag }}.tar.gz.sig
            dist/flask-gym-${{ steps.resolve_tag.outputs.release_tag }}.tar.gz.pem

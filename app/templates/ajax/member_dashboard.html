<div class="member-dashboard">
    <h3 class="section-title"><i class="glyphicon glyphicon-dashboard"></i> My Dashboard</h3>

    <!-- BMI Widget -->
    <div class="dashboard-row">
        <div class="widget widget--bmi">
            <h4 class="widget-title">Body Metrics</h4>
            <div class="bmi-display">
                <div class="bmi-circle" id="bmi-circle">
                    <span class="bmi-value" id="bmi-value">--</span>
                    <span class="bmi-label">BMI</span>
                </div>
                <div class="bmi-details">
                    <div class="bmi-detail-row">
                        <span class="detail-label">Category:</span>
                        <span class="detail-value" id="bmi-category">--</span>
                    </div>
                    <div class="bmi-detail-row">
                        <span class="detail-label">Weight:</span>
                        <span class="detail-value" id="bmi-weight">-- kg</span>
                    </div>
                    <div class="bmi-detail-row">
                        <span class="detail-label">Target:</span>
                        <span class="detail-value" id="bmi-target">-- kg</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Attendance Widget -->
        <div class="widget widget--attendance">
            <h4 class="widget-title">Today's Attendance</h4>
            <div class="attendance-actions">
                <button class="btn btn-success btn-lg" id="btn-checkin" onclick="doCheckin()">
                    <i class="glyphicon glyphicon-log-in"></i> Check In
                </button>
                <button class="btn btn-warning btn-lg" id="btn-checkout" onclick="doCheckout()" style="display:none;">
                    <i class="glyphicon glyphicon-log-out"></i> Check Out
                </button>
            </div>
            <div class="attendance-status" id="attendance-status">
                <span class="text-muted">Loading...</span>
            </div>
        </div>
    </div>

    <!-- Schedule Widget -->
    <div class="dashboard-row">
        <div class="widget widget--schedule">
            <h4 class="widget-title"><i class="glyphicon glyphicon-calendar"></i> Upcoming Classes</h4>
            <div class="schedule-list" id="schedule-list">
                <p class="text-muted">Loading schedule...</p>
            </div>
        </div>
    </div>

    <!-- Recent Attendance History -->
    <div class="dashboard-row">
        <div class="widget widget--history">
            <h4 class="widget-title"><i class="glyphicon glyphicon-time"></i> Recent Attendance</h4>
            <table class="table table-striped table-condensed">
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Check In</th>
                        <th>Check Out</th>
                        <th>Duration</th>
                    </tr>
                </thead>
                <tbody id="history-body">
                    <tr><td colspan="4" class="text-muted">Loading...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
(function() {
    // Load BMI data
    fetch('/api/v1/bmi')
        .then(r => r.json())
        .then(data => {
            if (data.bmi) {
                document.getElementById('bmi-value').textContent = data.bmi;
                document.getElementById('bmi-category').textContent = data.bmi_category;
                document.getElementById('bmi-weight').textContent = data.weight_kg + ' kg';
                document.getElementById('bmi-target').textContent = data.aim_weight_kg + ' kg';
                const circle = document.getElementById('bmi-circle');
                if (data.bmi_category === 'Normal') circle.classList.add('bmi--normal');
                else if (data.bmi_category === 'Underweight') circle.classList.add('bmi--underweight');
                else if (data.bmi_category === 'Overweight') circle.classList.add('bmi--overweight');
                else circle.classList.add('bmi--obese');
            }
        }).catch(() => {});

    // Load schedule
    fetch('/api/v1/schedule?per_page=5')
        .then(r => r.json())
        .then(data => {
            const list = document.getElementById('schedule-list');
            if (!data.schedule || data.schedule.length === 0) {
                list.innerHTML = '<p class="text-muted">No upcoming classes. Enroll in a course!</p>';
                return;
            }
            let html = '<ul class="list-group">';
            data.schedule.forEach(c => {
                const start = new Date(c.start).toLocaleString();
                html += `<li class="list-group-item">
                    <strong>${c.name}</strong>
                    <span class="badge">${start}</span>
                    <br><small class="text-muted">${c.description || ''}</small>
                </li>`;
            });
            html += '</ul>';
            list.innerHTML = html;
        }).catch(() => {});

    // Load attendance history
    fetch('/api/v1/attendance/history?limit=7')
        .then(r => r.json())
        .then(data => {
            const tbody = document.getElementById('history-body');
            if (!data.history || data.history.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" class="text-muted">No records yet.</td></tr>';
                return;
            }
            let rows = '';
            data.history.forEach(r => {
                const cin = r.check_in ? new Date(r.check_in).toLocaleTimeString() : '-';
                const cout = r.check_out ? new Date(r.check_out).toLocaleTimeString() : '-';
                const dur = r.duration_minutes ? r.duration_minutes + ' min' : '-';
                rows += `<tr><td>${r.date}</td><td>${cin}</td><td>${cout}</td><td>${dur}</td></tr>`;
            });
            tbody.innerHTML = rows;
        }).catch(() => {});

    // Check current attendance status
    fetch('/api/v1/attendance/history?limit=1')
        .then(r => r.json())
        .then(data => {
            const status = document.getElementById('attendance-status');
            const btnIn = document.getElementById('btn-checkin');
            const btnOut = document.getElementById('btn-checkout');
            if (data.history && data.history.length > 0) {
                const latest = data.history[0];
                const today = new Date().toISOString().split('T')[0];
                if (latest.date === today && !latest.check_out) {
                    btnIn.style.display = 'none';
                    btnOut.style.display = 'inline-block';
                    status.innerHTML = '<span class="text-success">You are checked in.</span>';
                    return;
                }
            }
            status.innerHTML = '<span class="text-muted">Not checked in yet today.</span>';
        }).catch(() => {});
})();

function doCheckin() {
    fetch('/api/v1/attendance/checkin', {method: 'POST'})
        .then(r => r.json())
        .then(data => {
            if (data.status === 'checked_in') {
                document.getElementById('btn-checkin').style.display = 'none';
                document.getElementById('btn-checkout').style.display = 'inline-block';
                document.getElementById('attendance-status').innerHTML =
                    '<span class="text-success">Checked in!</span>';
            } else {
                document.getElementById('attendance-status').innerHTML =
                    '<span class="text-warning">' + (data.error || 'Already checked in') + '</span>';
            }
        });
}

function doCheckout() {
    fetch('/api/v1/attendance/checkout', {method: 'POST'})
        .then(r => r.json())
        .then(data => {
            if (data.status === 'checked_out') {
                document.getElementById('btn-checkout').style.display = 'none';
                document.getElementById('btn-checkin').style.display = 'inline-block';
                document.getElementById('attendance-status').innerHTML =
                    '<span class="text-info">Checked out! Duration: ' +
                    (data.record.duration_minutes || '?') + ' min</span>';
            }
        });
}
</script>
